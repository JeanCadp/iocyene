    <line x1="850" y1="1250" x2="970" y2="1250" stroke="#C9B48A" stroke-width="1.5"/>
    <text x="830" y="1292" text-anchor="middle" class="corm" font-size="26" font-weight="600" fill="#0F3B36">Onde a sua fala encontra espaço,</text>
