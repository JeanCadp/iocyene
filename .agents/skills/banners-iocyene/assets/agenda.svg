      <g transform="translate(0,94)"><circle r="7" fill="none" stroke="#B49B6C" stroke-width="2"/><text x="28" y="8" class="mont" font-size="28" font-weight="700" fill="#0F3B36">Quinta-feira</text><text x="28" y="38" class="mont" font-size="16" font-weight="600" fill="#0F3B36" letter-spacing="1.5">ONLINE  ·  16h • 17h • 18h</text></g>
      <g transform="translate(0,188)"><circle r="7" fill="none" stroke="#B49B6C" stroke-width="2"/><text x="28" y="8" class="mont" font-size="28" font-weight="700" fill="#0F3B36">Sábado</text><text x="28" y="38" class="mont" font-size="16" font-weight="600" fill="#0F3B36" letter-spacing="1.5">PRESENCIAL  ·  10h • 11h • 12h</text></g>
    </g>

    <a href="https://wa.me/5562981494324?text=Ol%C3%A1%2C%20Iocyene!%20Vi%20sua%20agenda%20e%20gostaria%20de%20saber%20mais%20sobre%20os%20atendimentos%20em%20psican%C3%A1lise.">
      <g transform="translate(650,900)"><rect width="360" height="90" rx="45" fill="#0F3B36"/><circle cx="45" cy="45" r="20" fill="none" stroke="#C9B48A" stroke-width="2"/><path d="M36 38 c0 9 9 18 18 18 l4 -4 -6 -4 -3 3 c-4 -2 -6 -4 -8 -8 l3 -3 -4 -6 z" fill="#C9B48A"/><text x="82" y="38" class="mont" font-size="14" font-weight="600" fill="#C9B48A" letter-spacing="2">AGENDE PELO WHATSAPP</text><text x="82" y="70" class="mont" font-size="27" font-weight="700" fill="#FBF8F2">62 98149-4324</text></g>
