      .cinzel{font-family:'Cinzel',Georgia,serif}.corm{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic}.mont{font-family:'Montserrat',Arial,sans-serif}
    </style>
    <clipPath id="fotoClip"><rect x="0" y="0" width="640" height="1350"/></clipPath>
    <linearGradient id="fadeDir" x1="0" y1="0" x2="1" y2="0"><stop offset="0.70" stop-color="#EFE3D1" stop-opacity="0"/><stop offset="1" stop-color="#EFE3D1" stop-opacity="1"/></linearGradient>
    <linearGradient id="fadeBase" x1="0" y1="0" x2="0" y2="1"><stop offset="0.80" stop-color="#EFE3D1" stop-opacity="0"/><stop offset="1" stop-color="#EFE3D1" stop-opacity="1"/></linearGradient>
    <filter id="quente"><feColorMatrix type="saturate" values="0.78"/><feColorMatrix type="matrix" values="1.04 0.02 0 0 0.02  0.01 1.00 0 0 0.01  0 0 0.92 0 0  0 0 0 1 0"/></filter>
    <path id="estrela" d="M0 -1 C0.11 -0.33 0.33 -0.11 1 0 C0.33 0.11 0.11 0.33 0 1 C-0.11 0.33 -0.33 0.11 -1 0 C-0.33 -0.11 -0.11 -0.33 0 -1 Z"/>
